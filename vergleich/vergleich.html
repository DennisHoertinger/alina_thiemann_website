<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vergleich PR15 und PR19</title><meta name="robots" content="noindex, nofollow">
<style>body{margin:0;font:15px/1.4 Georgia,serif;background:#fbf9f4;color:#2a2118}header{padding:12px 16px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}button{font:inherit;border:1px solid #6b6c45;background:none;color:#6b6c45;border-radius:20px;padding:5px 14px;cursor:pointer}button[aria-pressed=true]{background:#6b6c45;color:#fff}main{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 12px 12px}h2{font-size:15px;margin:4px 0}iframe{width:100%;height:calc(100vh - 110px);border:1px solid #ccc;background:#fff}.handy iframe{width:390px;max-width:100%}</style></head>
<body><header><strong>Vergleich: links Stand PR15, rechts Stand PR19</strong>
<span><button data-s="startseite" aria-pressed="true">Startseite</button> <button data-s="vita" aria-pressed="false">Vita</button> <button data-s="medien" aria-pressed="false">Medien</button></span>
<label><input type="checkbox" id="handy" checked> Handybreite</label></header>
<main class="handy"><div><h2>PR15 (vor der neuen Vita)</h2><iframe id="a" src="pr15-startseite.html"></iframe></div><div><h2>PR19 (aktuell)</h2><iframe id="b" src="pr19-startseite.html"></iframe></div></main>
<script>document.querySelectorAll('button').forEach(k=>k.onclick=()=>{document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===k));a.src='pr15-'+k.dataset.s+'.html';b.src='pr19-'+k.dataset.s+'.html'});handy.onchange=()=>document.querySelector('main').classList.toggle('handy',handy.checked)</script></body></html>
