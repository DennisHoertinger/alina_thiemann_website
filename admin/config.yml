# Sveltia CMS für alinathiemann.de (aufrufen unter https://alinathiemann.de/admin/)
# Alina pflegt hier Texte und Fotos. Gespeichert wird als JSON in daten/,
# skripte/filmmakers.mjs setzt die Inhalte per GitHub Action in die HTML-Seiten ein.
# Was auf Filmmakers steht (Steckbrief, Film, Theater, Ausbildung, Preise) gehört NICHT hierher.
# Doku: https://sveltiacms.app/en/docs

backend:
  name: github
  repo: alina-thiemann/alina_thiemann_website
  branch: main
  # Anmelde-Dienst (Sveltia CMS Authenticator als Cloudflare Worker), sobald eingerichtet:
  # base_url: https://sveltia-cms-auth.NAME.workers.dev
  # und dann die Zeile auth_methods löschen (zeigt bis dahin nur „Mit Zugriffstoken anmelden“,
  # weil „Mit GitHub anmelden“ ohne Worker bei api.netlify.com mit „Not Found“ endet).
  auth_methods: [token]
  commit_messages:
    update: "CMS: {{collection}} „{{slug}}“ geändert ({{author-name}})"
    uploadMedia: "CMS: Foto „{{path}}“ hochgeladen ({{author-name}})"
    deleteMedia: "CMS: Foto „{{path}}“ gelöscht ({{author-name}})"

site_url: https://alinathiemann.de
display_url: https://alinathiemann.de

# Fotos liegen in img/. Hochgeladene Fotos werden im Browser auf höchstens 1600 px Breite
# verkleinert und als WebP gespeichert (iPhone-Originale haben bis zu 20 MB).
media_folder: img
public_folder: img
media_libraries:
  default:
    config:
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 1600

slug:
  encoding: ascii
  clean_accents: true

editor:
  preview: false

collections:
  - name: website
    label: Website
    description: Texte und Fotos. Steckbrief, Film, Theater und Ausbildung kommen automatisch von Filmmakers.
    icon: edit_note
    files:
      # ---------------------------------------------------------------- Texte
      - name: texte
        label: Texte (Über mich, Coaching)
        file: daten/texte.json
        format: json
        fields:
          - name: ueberMich
            label: Über mich (Startseite und Vita)
            widget: object
            hint: Absätze mit einer Leerzeile trennen. *Sternchen* macht kursiv, [Text](https://…) wird ein Link.
            fields:
              - { name: de, label: Deutsch, widget: text }
              - { name: en, label: Englisch, widget: text }
          - name: magIchSpielen
            label: Das mag ich spielen (Vita)
            widget: object
            fields:
              - { name: de, label: Deutsch, widget: text }
              - { name: en, label: Englisch, widget: text }
          - name: persoenliches
            label: Persönliches (Vita)
            label_singular: Angabe
            widget: list
            summary: "{{fields.etikett.de}}"
            fields:
              - name: etikett
                label: Überschrift (z. B. Lieblingsfilm)
                widget: object
                fields:
                  - { name: de, label: Deutsch, widget: string }
                  - { name: en, label: Englisch, widget: string }
              - name: text
                label: Text
                widget: object
                fields:
                  - { name: de, label: Deutsch, widget: text }
                  - { name: en, label: Englisch, widget: text }
          - name: coaching
            label: Coaching (Seite Coaching)
            widget: object
            fields:
              - name: untertitel
                label: Untertitel
                widget: object
                fields:
                  - { name: de, label: Deutsch, widget: string }
                  - { name: en, label: Englisch, widget: string }
              - name: text
                label: Text
                hint: Absätze mit einer Leerzeile trennen.
                widget: object
                fields:
                  - { name: de, label: Deutsch, widget: text }
                  - { name: en, label: Englisch, widget: text }
              - name: eckdaten
                label: Eckdaten
                label_singular: Eckdatum
                widget: list
                summary: "{{fields.etikett.de}}: {{fields.text.de}}"
                fields:
                  - name: etikett
                    label: Überschrift (z. B. Wie)
                    widget: object
                    fields:
                      - { name: de, label: Deutsch, widget: string }
                      - { name: en, label: Englisch, widget: string }
                  - name: text
                    label: Angabe
                    widget: object
                    fields:
                      - { name: de, label: Deutsch, widget: string }
                      - { name: en, label: Englisch, widget: string }

      # ---------------------------------------------------------------- Fotos
      - name: fotos
        label: Fotos
        file: daten/fotos.json
        format: json
        fields:
          - name: start
            label: Startbilder (laufen oben auf der Startseite)
            label_singular: Startbild
            hint: Reihenfolge durch Ziehen ändern. Das erste Bild erscheint zuerst.
            widget: list
            collapsed: true
            summary: "{{fields.alt.de}}"
            fields: &foto
              - { name: bild, label: Foto, widget: image, hint: Nur freigegebene Fotos verwenden. }
              - { name: credit, label: Credit (Fotograf:in und Jahr), widget: string, hint: "z. B. Stella Butz, 2026. Erscheint als „Foto: …“." }
              - name: alt
                label: Bildbeschreibung (für Blinde und Suchmaschinen)
                widget: object
                fields:
                  - { name: de, label: Deutsch, widget: string }
                  - { name: en, label: Englisch, widget: string }
              - { name: sichtbar, label: Auf der Website zeigen, widget: boolean, default: true }
          - name: fotos
            label: Fotostrecke auf der Startseite
            label_singular: Foto
            widget: list
            collapsed: true
            summary: "{{fields.alt.de}}"
            fields: *foto
          - name: vitaKopf
            label: Vita, Porträt oben
            widget: object
            fields:
              - { name: bild, label: Foto, widget: image }
              - { name: credit, label: Credit (Fotograf:in und Jahr), widget: string, hint: "z. B. Annette Hauschild, 2025. Erscheint als „Foto: …“." }
              - name: alt
                label: Bildbeschreibung (für Blinde und Suchmaschinen)
                widget: object
                fields:
                  - { name: de, label: Deutsch, widget: string }
                  - { name: en, label: Englisch, widget: string }
          - name: headshots
            label: Vita, Headshots (im Steckbrief)
            label_singular: Headshot
            hint: Reihenfolge durch Ziehen ändern.
            widget: list
            collapsed: true
            summary: "{{fields.alt.de}}"
            fields: *foto
          - name: teilen
            label: Teilen-Bild (Vorschau, wenn jemand den Link in WhatsApp, Instagram usw. teilt)
            widget: image
            required: false
            hint: Am besten ein Querformat-Foto. Es wird automatisch auf 1200 × 630 zugeschnitten (bei Hochformat bleibt der obere Teil mit dem Gesicht). Apps zeigen ein neues Bild manchmal erst nach ein paar Tagen.
          - name: vorschau
            label: Vorschau-Karten (Start und unten auf Vita, Film, Theater)
            hint: Ein Bild pro Karte. Am besten Hochformat, die Karte schneidet es zu.
            widget: object
            fields:
              - { name: vita, label: Karte Vita, widget: image }
              - { name: film, label: Karte Film, widget: image }
              - { name: theater, label: Karte Theater, widget: image }
              - { name: ausbildung, label: Karte Ausbildung, widget: image }
          - name: medien
            label: Fotos auf der Seite Medien
            label_singular: Foto
            widget: list
            collapsed: true
            summary: "{{fields.alt.de}}"
            fields: *foto

      # ---------------------------------------------------------------- Videos (YouTube)
      - name: videos
        label: Videos (YouTube-Links)
        file: daten/videos.json
        format: json
        # Showreels, About me und weitere Videos. Neues Video bei YouTube hochladen, Link hier eintragen, speichern. Nach etwa zwei Minuten ist es überall auf der Website.
        fields:
          - name: reihenfolge
            label: Reihenfolge der Videos auf der Startseite
            label_singular: Video
            hint: Durch Ziehen sortieren. Ein Video, das hier fehlt, erscheint nicht auf der Startseite (auf Film, Theater und Medien bleibt es).
            widget: list
            field:
              name: video
              label: Video
              widget: select
              options:
                - { label: Film-Showreel, value: filmShowreel }
                - { label: About me, value: aboutMe }
                - { label: Theater-Showreel, value: theaterShowreel }
          - name: filmShowreel
            label: Film-Showreel (Start, Film, Medien)
            widget: object
            fields: &video
              - { name: youtube, label: YouTube-Link, widget: string, hint: "z. B. https://youtu.be/PDxR_VmuQr8 (Teilen-Link aus YouTube). Das Video muss öffentlich oder „nicht gelistet“ sein und Einbetten erlauben." }
              - name: titel
                label: Titel
                widget: object
                fields:
                  - { name: de, label: Deutsch, widget: string }
                  - { name: en, label: Englisch, widget: string, required: false }
              - { name: angabe, label: "Jahr und Länge", widget: string, required: false, hint: "z. B. 2026 · 4:11 Min." }
              - { name: standbild, label: Standbild (erscheint vor dem Abspielen), widget: image, hint: "Querformat 16:9. Bis zum Tippen lädt nichts von YouTube, deshalb braucht es ein eigenes Bild." }
          - name: theaterShowreel
            label: Theater-Showreel (Start, Theater, Medien)
            widget: object
            fields: *video
          - name: aboutMe
            label: About me (Start, Film, Medien)
            widget: object
            fields: *video
          - name: weitere
            label: Weitere Videos (Seite Medien)
            label_singular: Video
            widget: list
            required: false
            hint: Beliebig viele zusätzliche Videos. Sie erscheinen auf der Seite Medien unter „Weitere Videos“, in der Reihenfolge dieser Liste.
            summary: "{{fields.titel.de}}"
            fields:
              - { name: youtube, label: YouTube-Link, widget: string, hint: "Teilen-Link aus YouTube, z. B. https://youtu.be/… Das Video muss öffentlich oder „nicht gelistet“ sein und Einbetten erlauben." }
              - name: titel
                label: Titel
                widget: object
                fields:
                  - { name: de, label: Deutsch, widget: string }
                  - { name: en, label: Englisch, widget: string, required: false }
              - { name: angabe, label: "Jahr und Länge", widget: string, required: false, hint: "z. B. 2026 · 4:11 Min." }
              - { name: standbild, label: Standbild (erscheint vor dem Abspielen), widget: image, hint: "Querformat 16:9. Bis zum Tippen lädt nichts von YouTube, deshalb braucht es ein eigenes Bild." }
              - { name: sichtbar, label: Auf der Website zeigen, widget: boolean, default: true, required: false }

      # ---------------------------------------------------------------- Kacheln Film und Theater
      - name: kacheln
        label: Bilder der Film- und Theaterkacheln (Titel, Rolle, Regie kommen von Filmmakers)
        file: daten/kacheln.json
        format: json
        fields:
          - name: film
            label: Film
            label_singular: Film
            widget: list
            collapsed: true
            summary: "{{fields.titel}}"
            hint: Der Titel muss genau so geschrieben sein wie auf Filmmakers, sonst wird die Kachel nicht gefunden.
            fields:
              - { name: titel, label: Titel (wie auf Filmmakers), widget: string }
              - name: bilder
                label: Bilder
                hint: "Ein Bild oder mehrere zum Wischen. Leer = „Foto folgt“ (bei Filmen mit Video das Standbild). Bei einem Film mit Video liegt ein einzelnes Bild über dem Film."
                widget: list
                required: false
                field: { name: bild, label: Bild, widget: image }
              - { name: plakat, label: Erstes Bild als Filmplakat zeigen (nicht zuschneiden), widget: boolean, default: false, required: false }
              - { name: foto, label: "Foto-Credit (z. B. Björn Klein)", widget: string, required: false, hint: "Erscheint als „Foto: …“ unter der Kachel." }
          - name: theater
            label: Theater
            label_singular: Stück
            widget: list
            collapsed: true
            summary: "{{fields.titel}}"
            hint: Der Titel muss genau so geschrieben sein wie auf Filmmakers, sonst wird die Kachel nicht gefunden.
            fields:
              - { name: titel, label: Titel (wie auf Filmmakers), widget: string }
              - name: bilder
                label: Bilder
                hint: "Ein Bild oder mehrere zum Wischen, am besten Hochformat (die Kachel ist 4:5). Leer = „Foto folgt“."
                widget: list
                required: false
                field: { name: bild, label: Bild, widget: image }
              - { name: foto, label: "Foto-Credit (z. B. Bahriye)", widget: string, required: false, hint: "Erscheint als „Foto: …“ unter der Kachel." }
